[workspace]
members = [
    "crates/gmr-core",
    "crates/gmr-expr",
    "crates/gmr-probe",
    "crates/gmr-content",
    "crates/gmr-store",
    "crates/gmr-runtime",
    "crates/gmr",
    "batteries/transport",
    "batteries/provider",
    "batteries/survey",
    "domains/coding/extract",
    "domains/coding/cli",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"

[workspace.lints.clippy]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"
ryu = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tempfile = "3"
