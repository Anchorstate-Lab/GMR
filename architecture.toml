# gate.sh 的依赖禁区清单。**不是 GMR 的数据。**
#
# 没有任何 GMR 代码读这个文件：不走探针，不走锚，不进日志，不随产品分发。
# 陌生用户装上 gmr 永远不会见到它。它只被 gate.sh 里那段 Python 读，用来跑
# `cargo tree` 比对禁用库 —— 一个手写 linter 的配置，恰好也是 TOML。
#
# 为什么这些判据不做成锚：`gmr-expr` 有没有依赖 tokio，`cargo tree` 一跑就是
# 确定答案，没有需要人判断的余地。README 写着「事实完全决定判断 → 别锚」，
# 这正是那一类。锚留给「事实约束判断但不决定判断」的东西。
#
# **这里只留 gate.sh 真的会读的字段。** 曾经还有 may_depend_on、pure_root、
# linkable、zh/why 和一批 kind=document/whole/corpus 的成员，全部没有任何代码
# 读取 —— 声明和事实分家，正是这套工具要治的病，不该由它自己得。删掉的东西
# 要么已被别的检查机械覆盖，要么降级成了下面的注释。

# ── 命名的库清单 ───────────────────────────────────────────────
# 判据引用这些名字，**探针不再各自硬编码**。改一处，全部引用它的成员跟着变。

[libs]
domain = ["syn", "proc-macro2", "quote", "tree-sitter", "swc_ecma_parser", "rustc_ast", "regex-syntax"]
io     = ["tokio", "reqwest", "hyper", "mio", "socket2", "sqlx", "sqlx-core", "async-std", "rusqlite", "libsqlite3-sys"]
db     = ["sqlx", "rusqlite", "libsqlite3-sys", "postgres", "tokio-postgres"]

# ── 层 ─────────────────────────────────────────────────────────
# 只有 forbidden 被读。层内的依赖顺序不在这里，也不在别处声明 —— 它由
# gate.sh 的分层检查兑现（crates < batteries < domains，底层不许依赖上层）。
# 那条检查兑现的是「基底与电池不许知道任何一个域」：抽取器住在 domains/ 下，
# rank 最高，crates/ 或 batteries/ 链接它就是底层依赖上层。

# 基底：领域无关。
[layer.substrate]
forbidden = ["domain"]

# 域：判据、探针实现、装配。没有禁区 —— 语言知识本来就归这里，而「有没有
# 判断」不是依赖清单量得出来的，判断住在 rules 里。
[layer.domain]
forbidden = []

# 电池：可复用的具体实现，被域装配选用；不知道自己会被哪个域用。
[layer.battery]
forbidden = ["domain"]

# ── 成员 ───────────────────────────────────────────────────────
# **name 必须是 cargo 认得的包名**，path 必须指向真的 Cargo.toml —— 禁区检查
# 走 `cargo tree --manifest-path <path>/Cargo.toml`，路径写错会让 gate 报
# 「够不到这些成员」而不是静默通过。

[[member]]
name  = "gmr-core"
layer = "substrate"
kind  = "package"
path  = "crates/gmr-core"

[[member]]
name      = "gmr-expr"
layer     = "substrate"
kind      = "package"
path      = "crates/gmr-expr"
forbidden = ["io"]          # 纯根之外：求值那一跳不许碰世界

[[member]]
name  = "gmr-probe"
layer = "substrate"
kind  = "package"
path  = "crates/gmr-probe"

[[member]]
name  = "gmr-content"
layer = "substrate"
kind  = "package"
path  = "crates/gmr-content"

[[member]]
name              = "gmr-store"
layer             = "substrate"
kind              = "package"
path              = "crates/gmr-store"
forbidden_default = ["db"]  # 后端是 feature：默认 feature 集里不许有数据库

[[member]]
name  = "gmr-runtime"
layer = "substrate"
kind  = "package"
path  = "crates/gmr-runtime"

[[member]]
name  = "gmr"
layer = "substrate"
kind  = "package"
path  = "crates/gmr"

[[member]]
name              = "gmr-transport"
layer             = "battery"
kind              = "package"
path              = "batteries/transport"
forbidden_default = ["io"]  # 后端是 feature：默认 feature 集里不许有 io 依赖

[[member]]
name              = "gmr-provider"
layer             = "battery"
kind              = "package"
path              = "batteries/provider"
forbidden_default = ["io"]

[[member]]
name              = "gmr-survey"
layer             = "battery"
kind              = "package"
path              = "batteries/survey"
forbidden_default = ["io"]  # 索引后端是 feature：默认 feature 集里不许有数据库或运行时

[[member]]
name  = "coding-extract"
layer = "domain"
kind  = "package"
path  = "domains/coding/extract"

[[member]]
name  = "coding-anchor"
layer = "domain"
kind  = "package"
path  = "domains/coding/cli"
