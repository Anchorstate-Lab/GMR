  'not exists(state.n) => { position: state.position, scope: obs.at.scope, n: obs.facts.occurrences, files: obs.facts.files, status: "captured" }',
  'obs.at.scope != state.scope => { position: state.position, scope: obs.at.scope, n: obs.facts.occurrences, files: obs.facts.files, was: state.scope, status: "entered-code" }',
  'obs.facts.occurrences != state.n => { position: state.position, scope: obs.at.scope, n: obs.facts.occurrences, files: obs.facts.files, was: state.n, status: "count-moved" }',
]

[[anchor]]
key = "tests::roster"
artifact = "f3f0bf8a3adb7f0dd1cdea3e29e84a819b829a404f88b7ac8d69d1741c6ccd04"
params = { root = "." }
rules = [
  'not exists(state.tests) => { test_count: obs.test_count, ignored_count: obs.ignored_count, tests: obs.tests, ignored: obs.ignored, status: "captured" }',
  # 名册变短 = 一条契约被撤回。CI 看不见,这里看得见。
  'obs.test_count < state.test_count => { test_count: obs.test_count, ignored_count: obs.ignored_count, tests: obs.tests, ignored: obs.ignored, was: state.tests, status: "test-removed" }',
  # 契约还在文件里,但不再被兑现。
  'obs.ignored_count > state.ignored_count => { test_count: obs.test_count, ignored_count: obs.ignored_count, tests: obs.tests, ignored: obs.ignored, was: state.ignored, status: "test-ignored" }',
  # 数量没少但名册动了:纯新增,或者删N加N。两份都留下,差集归读的人。
  'changed("tests") => { test_count: obs.test_count, ignored_count: obs.ignored_count, tests: obs.tests, ignored: obs.ignored, was: state.tests, status: "roster-changed" }',
]
