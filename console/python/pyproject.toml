[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "anchorstate-gmr"
description = "GMR's Python door: anchor what an agent knows to recomputable observations, and ask whether it still stands."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]

[tool.maturin]
module-name = "gmr"
manifest-path = "Cargo.toml"
features = ["extension-module"]
