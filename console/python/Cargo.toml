[package]
name = "gmr-python"
description = "The console's Python door: the same verb table node serves, synchronous, values as dicts in and out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "gmr"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
gmr-api = { package = "gmr", path = "../../crates/gmr", features = ["sqlite"] }
gmr-console = { path = "../core" }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
pyo3 = { version = "0.23", features = ["abi3-py39"] }
pythonize = "0.23"

[features]
default = []
extension-module = ["pyo3/extension-module"]
