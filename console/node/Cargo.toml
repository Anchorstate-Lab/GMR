[package]
name = "gmr-node"
description = "域：Node 绑定。翻译类型，不折叠、不判决、不重试。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
gmr = { path = "../../crates/gmr", features = ["sqlite"] }
gmr-console = { path = "../core" }
chrono = { workspace = true }
gmr-provider = { path = "../../batteries/provider", features = ["git", "claude-code", "mem0"] }
gmr-transport = { path = "../../batteries/transport", features = ["shell", "script", "http", "file", "sql", "postgres"] }
napi = { version = "3", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
