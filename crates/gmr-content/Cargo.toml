[package]
name = "gmr-content"
description = "取回的契约：引用 → 字节与版本。提供方的实现是电池，不在这里。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# 契约自带的一致性套件，跟 gmr-store 的 testkit 同一个惯例。
# 它验的是类型表达不了的那两条：版本追踪什么，Ok(None) 主张什么。
testkit = []

[dependencies]
gmr-core = { path = "../gmr-core" }
# Budget 是所有对外调用共用的预算词汇，暂住 gmr-probe；出现第三个使用者
# 时搬走。见 CLAUDE.md §5。
gmr-budget = { path = "../gmr-budget" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
