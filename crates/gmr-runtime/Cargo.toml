[package]
name = "gmr-runtime"
description = "编排：把 core / expr / probe / content / store 装成 open · observe · bind · revise · close · read。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gmr-budget = { path = "../gmr-budget" }
gmr-core = { path = "../gmr-core" }
gmr-expr = { path = "../gmr-expr" }
# default-features = false：runtime 只要 Transport trait，不替使用方
# 选传输方式。开哪个 transport 由门面/产品决定。
gmr-probe = { path = "../gmr-probe", default-features = false }
gmr-content = { path = "../gmr-content" }
gmr-store = { path = "../gmr-store" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# 组合子，不是执行器。`buffered` 只是并发地 poll 已有的 future,
# 由调用方的运行时驱动 —— gmr-runtime 仍然零 tokio 依赖。
futures-util = { workspace = true }

[dev-dependencies]
# **测试要一个真传输,而传输是电池。** dev 依赖不进 production 的依赖
# 清单,所以「基底不 ship 后端」那条机械检查仍然成立 —— 但这个方向是
# 真的存在的,写在这里而不是藏起来。
gmr-transport = { path = "../../batteries/transport", features = ["testkit", "file", "inproc"] }
async-trait = { workspace = true }
gmr-store = { path = "../gmr-store", features = ["testkit"] }
gmr-probe = { path = "../gmr-probe" }
gmr-content = { path = "../gmr-content" }
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
