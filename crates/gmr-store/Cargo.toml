[package]
name = "gmr-store"
description = "GMR 的存储：契约（只出动词）+ 可选后端。后端是 feature，不是包。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# ── 后端：一个 feature 一个，跟 sqlx / object_store / opendal 同一个惯例。
#    加 Postgres = 加一个 feature + 一个模块，**不是加一个包**。
sqlite = ["dep:sqlx"]
# 契约自带的参考实现。不是部署选项 —— 它撑不过进程重启。
testkit = []

[dependencies]
gmr-core = { path = "../gmr-core" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, optional = true }

# 测试跑一致性套件：两个后端各一遍。
[dev-dependencies]
gmr-store = { path = ".", features = ["sqlite", "testkit"] }
tokio = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }

[lints]
workspace = true
