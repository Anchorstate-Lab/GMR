<!-- ══ 页脚：这张图的论点 ══ -->
<line x1="30" y1="1304" x2="1478" y2="1304" stroke="#d3d7cf"/>
<text x="30" y="1328" font-size="13" font-weight="600" fill="#14181d">这张图想说的三件事</text>
<text x="30" y="1350" font-size="12" fill="#5c635f"><tspan font-weight="600" fill="#9c3a2c">一 · 耦合面是可数的。</tspan>跨包耦合总共只有 5 个 trait：Transport · Journal · Queue · BindingStore · ContentProvider。其余流动的全是值类型 —— 没有回调、没有共享可变状态、没有事件总线。</text>
<text x="30" y="1370" font-size="12" fill="#5c635f"><tspan font-weight="600" fill="#9c3a2c">二 · 方向是倒置的。</tspan>基底声明 trait，电池实现 trait，域在 main 里把两头接上。所以「换 sqlite 为别的」「换 shell 为 http」只改域的一行装配，基底和电池都不知道发生了什么。</text>
<text x="30" y="1390" font-size="12" fill="#5c635f"><tspan font-weight="600" fill="#9c3a2c">三 · 基底里有两个纯根，不是一个。</tspan>gmr-core 是词汇，gmr-expr 是求值 —— 后者连前者都不依赖，只认 JSON。这道缝保证了：换掉整套词汇，求值器一行不动。</text>
</svg>
