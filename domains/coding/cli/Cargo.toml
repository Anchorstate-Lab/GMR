[package]
name = "coding-anchor"
description = "coding 域的装配：把基底、脚本传输与 git 内容提供方接起来，跑这个仓库自己的判据。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gmr"
path = "src/main.rs"

[dependencies]
# 基底
gmr = { path = "../../../crates/gmr", features = ["sqlite"] }
# 电池 —— **挑哪一块是域的决定**，这三行就是那个决定
gmr-transport = { path = "../../../batteries/transport", features = ["shell", "inproc", "script"] }
gmr-provider = { path = "../../../batteries/provider", features = ["git", "claude-code"] }
gmr-survey = { path = "../../../batteries/survey" }
gmr-atlas = { path = "../../../batteries/atlas" }
# 域自己的抽取器 —— 链接进来，不 exec
coding-extract = { path = "../extract" }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tempfile.workspace = true
serde_yaml_ng = "0.10.0"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[lints]
workspace = true
