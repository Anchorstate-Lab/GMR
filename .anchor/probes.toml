# Script probe declarations. The four extractors (ast-map · addr-map · name-map · prose-map)
# are not listed here — they are built into the binary, and their identity is earned by their semantic closure.
# `probes list` prints them.
#
# This file contains only the non-extractor kind: shell probes that ask external programs.

# This probe does not use coord and shells out to cargo and jq. It reports facts about the host,
# not about the repository. env_from_host tells the transport layer to downgrade verifiability to Open,
# which is exactly what this probe deserves.
[probe.test-roster]
stage = { probe = "packs/coding/probes/test-roster.sh" }
entrypoint = "probe"
sources = ["packs/coding/probes/test-roster.sh"]
env_from_host = ["HOME", "PATH"]
obs = { schema = "gmr.probe-test-roster.v1", at = [], facts = [] }
