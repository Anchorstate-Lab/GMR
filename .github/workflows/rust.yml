name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Substrate gate
      run: sh gate.sh

  # Kept out of the gate on purpose. gate.sh only checks the substrate and the
  # batteries and never touches an anchor, because a red anchor is a signal for
  # a human rather than a build failure. This job asserts on a fixture repo's
  # anchors, which are test data, and on the one thing the product is for: when
  # a fact moves, the note bound to it comes back.
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    # The step count is greped, not just the exit code. This script was once
    # truncated mid-heredoc: sh took the unterminated <<'EOF' as delimited by
    # end-of-file, so it parsed, exited 0, and tested almost nothing. Only the
    # sentinel catches that, and tools/gate.py keeps this number in step with
    # the script.
    - name: A stranger, a non-Rust repo, no toolchain
      run: |
        set -o pipefail
        sh acceptance.sh | tee /tmp/acceptance.out
        grep -q 'ACCEPTANCE COMPLETE steps=14' /tmp/acceptance.out \
          || { echo "acceptance.sh did not run every step it declares"; exit 1; }
