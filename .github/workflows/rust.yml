name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  moment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: What does this change move
      uses: ./
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        source: cargo

  gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Substrate gate
      run: sh gate.sh
    - name: The menu walkthrough still holds
      run: |
        cargo build --release -p coding-anchor
        PATH="$PWD/target/release:$PATH" sh examples/menu/walkthrough.sh --ci

  # Kept out of the gate on purpose. gate.sh only checks the substrate and the
  # batteries and never touches an anchor, because a red anchor is a signal for
  # a human rather than a build failure. This job asserts on a fixture repo's
  # anchors, which are test data, and on the one thing the product is for: when
  # a fact moves, the note bound to it comes back.
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    # The step count is greped, not just the exit code. This script was once
    # truncated mid-heredoc: sh took the unterminated <<'EOF' as delimited by
    # end-of-file, so it parsed, exited 0, and tested almost nothing. Only the
    # sentinel catches that, and tools/gate.py keeps this number in step with
    # the script.
    - name: A stranger, a non-Rust repo, no toolchain
      run: |
        set -o pipefail
        sh acceptance.sh | tee /tmp/acceptance.out
        grep -q 'ACCEPTANCE COMPLETE steps=4' /tmp/acceptance.out \
          || { echo "acceptance.sh did not run every step it declares"; exit 1; }

  # The addon is a cdylib, so `cargo test` never loads it and never learns
  # whether Node can. This job builds it and drives the six verbs from
  # JavaScript -- the only place the binding's own translation is exercised.
  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: The six verbs, from JavaScript
      run: sh domains/node/test.sh

  # The postgres branch cannot be exercised without a postgres, so the tests
  # that reach one are #[ignore]d and this job is where they run. Without it
  # the second backend is checked only by the assertions that never connect.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: gmr
          POSTGRES_DB: gmr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - name: A second backend, against a real one
      env:
        GMR_TEST_POSTGRES_URL: postgres://postgres:gmr@127.0.0.1:5432/gmr
      run: cargo test -p gmr-transport --test sql -- --ignored

  # Layer 3 of the gate: land a known break in the product and insist the
  # promises notice. A promise no mutation can break is a promise nothing is
  # really checking, and that is how a suite spends years green while testing
  # nothing -- this repository has already lost two days to that exact failure.
  #
  # It rebuilds the binary once per mutation, so it does not stand in front of
  # every pull request. What does is tools/gate.py's static half, which checks
  # on every PR that each mutation still aims at code that exists and at a
  # promise that exists -- the way this layer would otherwise rot silently.
  sentinels:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Do the promises still have teeth?
      run: |
        cargo build --release -p coding-anchor
        python3 tools/acceptance.py --sentinels-only
