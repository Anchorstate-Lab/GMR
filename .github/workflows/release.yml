name: Build and release prebuilt binaries

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

# Serializes releases so two pushes landing close together can't both read
# the same "latest tag" before either has pushed its own — queued rather
# than cancelled, because a release build shouldn't be killed mid-flight by
# the next merge.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Patch is CI's alone (tools/gate.py's check_version_bump enforces that no
  # PR moves it). This job only decides anything on an ordinary push to
  # main; a tag push (manual re-run of a specific release) or a manual
  # dispatch skips straight to building whatever ref was already named.
  #
  # Bumping and tagging here, in the same workflow that builds and
  # publishes, is deliberate rather than a second workflow triggered off
  # the tag push: pushes made with the default GITHUB_TOKEN never trigger
  # any workflow run (GitHub's anti-recursion rule), so a separate
  # `on: push: tags:` workflow would silently never fire.
  bump-version:
    name: Decide the next version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether shipped paths changed
        id: touched
        run: |
          set -eu
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" \
              | grep -E '^(crates/|batteries/|console/|packs/|dist/|Cargo\.toml$|Cargo\.lock$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing shipped moved — skipping release
        if: steps.touched.outputs.changed == 'false'
        run: echo "push touched no path that affects the built binary or npm package; no release"

      - name: Decide version
        id: decide
        if: steps.touched.outputs.changed == 'true'
        run: |
          set -eu
          CUR=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "no v* tag reachable — nothing to bump from" >&2
            exit 1
          fi
          TAGV=${TAG#v}
          IFS=. read -r CUR_MAJ CUR_MIN CUR_PAT <<< "$CUR"
          IFS=. read -r TAG_MAJ TAG_MIN TAG_PAT <<< "$TAGV"
          if [ "$CUR_MAJ" = "$TAG_MAJ" ] && [ "$CUR_MIN" = "$TAG_MIN" ]; then
            VERSION="$TAG_MAJ.$TAG_MIN.$((TAG_PAT + 1))"
          else
            VERSION="$CUR"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The sed above is a no-op whenever the version was already claimed by
      # hand -- the deliberate major/minor line CLAUDE.md documents, edited in
      # the PR that earns it. Then there is nothing to commit, and an
      # unconditional `git commit` exits 1 under `set -e`, killing the release
      # before it tags. That path had never been exercised until v0.5.0 tried
      # it. So commit only when the tree actually moved: on an ordinary push
      # CI's own bump makes the diff, and on a claimed line the merge commit
      # already carries the right version for the tag to land on.
      - name: Write version, tag, push
        if: steps.touched.outputs.changed == 'true'
        run: |
          set -eu
          VERSION="${{ steps.decide.outputs.version }}"
          TAG="${{ steps.decide.outputs.tag }}"
          sed -i -E 's/^version = ".*"$/version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "chore(release): $TAG"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

  build-linux:
    name: Build Linux targets
    needs: bump-version
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.bump-version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag || github.ref_name }}

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cross
        run: cargo install cross --locked

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p artifacts
          BIN=target/${{ matrix.target }}/release/gmr
          if [ ! -f "$BIN" ]; then echo "binary not found: $BIN"; exit 1; fi
          TARFILE="artifacts/gmr-${{ matrix.target }}.tar.gz"
          mkdir -p tmp/bin
          cp "$BIN" tmp/bin/gmr
          PACK=bin
          for made in libgmr_node.so libgmr_node.dylib gmr_node.dll; do
            if [ -f "target/${{ matrix.target }}/release/$made" ]; then
              cp "target/${{ matrix.target }}/release/$made" tmp/gmr.node
              PACK="bin gmr.node"
              break
            fi
          done
          if [ "$PACK" = bin ]; then echo "addon not found for ${{ matrix.target }}"; exit 1; fi
          tar -czf "$TARFILE" -C tmp $PACK
          rm -rf tmp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmr-${{ matrix.target }}
          path: artifacts/gmr-${{ matrix.target }}.tar.gz

  build-macos:
    name: Build macOS targets
    needs: bump-version
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.bump-version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag || github.ref_name }}

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Add target
        run: rustup target add ${{ matrix.target }} || true

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p artifacts
          BIN=target/${{ matrix.target }}/release/gmr
          if [ ! -f "$BIN" ]; then echo "binary not found: $BIN"; exit 1; fi
          TARFILE="artifacts/gmr-${{ matrix.target }}.tar.gz"
          mkdir -p tmp/bin
          cp "$BIN" tmp/bin/gmr
          PACK=bin
          for made in libgmr_node.so libgmr_node.dylib gmr_node.dll; do
            if [ -f "target/${{ matrix.target }}/release/$made" ]; then
              cp "target/${{ matrix.target }}/release/$made" tmp/gmr.node
              PACK="bin gmr.node"
              break
            fi
          done
          if [ "$PACK" = bin ]; then echo "addon not found for ${{ matrix.target }}"; exit 1; fi
          tar -czf "$TARFILE" -C tmp $PACK
          rm -rf tmp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmr-${{ matrix.target }}
          path: artifacts/gmr-${{ matrix.target }}.tar.gz

  create-release:
    name: Create GitHub release and attach artifacts
    needs: [bump-version, build-linux, build-macos]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.bump-version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.bump-version.outputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.bump-version.outputs.tag || github.ref_name }}
          files: release-artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Create and publish platform npm packages
    needs: [bump-version, create-release]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.bump-version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          set -eu
          if [ -n "${{ needs.bump-version.outputs.version }}" ]; then
            echo "version=${{ needs.bump-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure npm auth
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"

      - name: Prepare platform packages
        if: env.NPM_TOKEN != ''
        run: |
          set -eu
          mkdir -p packaged
          VERSION="${{ steps.ver.outputs.version }}"
          map_target() {
            case "$1" in
                x86_64-unknown-linux-gnu) echo "@anchorstate-lab/gmr-linux-x64" ;;
                aarch64-unknown-linux-gnu) echo "@anchorstate-lab/gmr-linux-arm64" ;;
                x86_64-apple-darwin) echo "@anchorstate-lab/gmr-darwin-x64" ;;
                aarch64-apple-darwin) echo "@anchorstate-lab/gmr-darwin-arm64" ;;
                *) echo "" ;;
              esac
          }
          for f in release-artifacts/*/*.tar.gz; do
            fname=$(basename "$f")
            # extract target from filename like gmr-<target>.tar.gz
            target=$(echo "$fname" | sed -E 's/^gmr-(.*)\.tar\.gz$/\1/')
            pkgname=$(map_target "$target")
            if [ -z "$pkgname" ]; then echo "unknown target $target"; exit 1; fi
            sh dist/scripts/create_platform_npm.sh "$f" "$pkgname" "$VERSION" packaged
          done

      - name: Publish platform packages to npm
        if: env.NPM_TOKEN != ''
        run: |
          set -eu
          for tgz in ./packaged/*.tgz; do
            echo "Publishing $tgz"
            npm publish "$tgz" --access public
          done

      - name: Publish wrapper package
        if: env.NPM_TOKEN != ''
        run: |
          set -eu
          VERSION="${{ steps.ver.outputs.version }}"
          export VERSION
          node -e '
            const fs = require("fs");
            const path = "dist/npm/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.VERSION;
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = process.env.VERSION;
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          '
          npm publish ./dist/npm --access public
