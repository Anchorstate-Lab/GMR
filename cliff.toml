# git-cliff's config. Not GMR data — same status as architecture.toml, just
# happens to be TOML too. No GMR code reads this. tools/gate.py no longer
# does either: it once shelled out to `git-cliff --bumped-version` to check
# Cargo.toml's version, but that trusted git-cliff's read of commit
# messages, and a squash-merged PR can flatten a `!`-marked breaking commit
# into a non-`!` PR-title commit that git-cliff has no way to see through —
# the same class of wrong-size bump this flag was written to prevent,
# recurring by a different mechanism. Version arithmetic moved to
# tools/gate.py's check_version_bump, which computes patch itself and
# trusts nothing about commit-message shape. This file, and the flag below,
# now only shape changelog text for whoever runs git-cliff by hand.
#
# breaking_always_bump_major defaults to true: any breaking commit jumps
# major straight from 0 to 1. That is not what 0.x semver wants — a breaking
# change at 0.x.y should bump y, major stays at 0 (this is how cargo itself
# reads 0.x semver).
[bump]
breaking_always_bump_major = false

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactor" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^spec", group = "Spec" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^ci", group = "Miscellaneous Tasks" },
    { message = "^revert", group = "Revert" },
    { message = ".*", group = "Other" },
]
filter_commits = false
topo_order_commits = true
sort_commits = "oldest"

[changelog]
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
