[package]
name = "gmr-provider"
description = "电池：ContentProvider 的具体实现。一个后端一个 feature + 一个模块，不是一个包。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gmr-core = { path = "../../crates/gmr-core", optional = true }
gmr-content = { path = "../../crates/gmr-content", optional = true }
gmr-probe = { path = "../../crates/gmr-probe", optional = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# 一致性套件对每个后端各跑一遍，所以自己的测试得把每个后端都打开。
gmr-provider = { path = ".", features = ["git", "claude-code", "mem0", "testkit"] }
gmr-content = { path = "../../crates/gmr-content", features = ["testkit"] }
tokio = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }

[features]
default = []
# ── 后端：一个 feature 一个，跟 crates/gmr-store 的 sqlite feature 同一个
#    惯例。加 mem0 / Claude 原生记忆 = 加一个 feature + 一个模块。
git = ["dep:gmr-core", "dep:gmr-content", "dep:gmr-probe", "dep:async-trait", "dep:tokio"]
claude-code = ["dep:gmr-core", "dep:gmr-content", "dep:gmr-probe", "dep:async-trait"]
# mem0 走网络，所以它带 reqwest —— architecture.toml 把 reqwest 归在 io，
# 而 gmr-provider 的 forbidden_default 禁 io，于是这一条只能是非默认 feature。
mem0 = [
    "dep:gmr-core", "dep:gmr-content", "dep:gmr-probe", "dep:async-trait",
    "dep:serde", "dep:serde_json", "dep:reqwest",
]
# 一个住在内存里的 mem0，让走网络的后端也能跑本地后端跑的那套一致性套件。
# 不是部署选项 —— 跟 gmr-store 的 testkit 同一个惯例。
testkit = ["mem0"]

[lints]
workspace = true
