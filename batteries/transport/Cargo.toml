[package]
name = "gmr-transport"
description = "电池：Transport 的具体实现。一个后端一个 feature + 一个模块，不是一个包。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gmr-probe = { path = "../../crates/gmr-probe" }
gmr-core = { path = "../../crates/gmr-core", optional = true }
serde_json = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
default = []
# ── 后端：一个 feature 一个，跟 sqlx / object_store / opendal 同一个惯例，
#    也跟 crates/gmr-store 的 sqlite feature 一样。加 http = 加一个
#    feature + 一个模块，不是加一个包。
shell = ["dep:gmr-core", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:thiserror", "dep:serde"]
# 契约自带的参考实现，只服务 shell 后端的测试。
testkit = ["shell", "dep:tempfile"]

[dev-dependencies]
gmr-transport = { path = ".", features = ["shell", "testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[lints]
workspace = true
