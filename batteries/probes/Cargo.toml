# 探针工件：exec 不 link，自成一个 workspace，跟根 workspace 的依赖解析
# 互不干扰。coord 是这五个成员共用的坐标约定库，只被这个 workspace 内部
# 依赖，不被根 workspace 的任何包依赖。

[workspace]
members = ["coord", "addr-map", "ast-map", "name-map", "prose-map"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"

[workspace.lints.clippy]

[workspace.dependencies]
serde_json = "1"
gmr-probe-coord = { path = "coord" }
