# 电池：在一个文件树里找候选，按模糊坐标报告哪几项对上。
#
# 领域无关：它不认识任何一门语言。语言知识住在域里。

[package]
name = "gmr-survey"
description = "电池：模糊坐标的匹配与报告，以及走查文件树的那一跳。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
sqlite = ["dep:rusqlite"]
# The contract's own reference implementation. Not a deployment option — it
# does not survive a process restart.
testkit = []
bridge = ["dep:tokio"]

[dependencies]
gmr-budget = { path = "../../crates/gmr-budget" }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
tokio = { workspace = true, optional = true }

# 测试跑一致性套件：两个后端各一遍。
[dev-dependencies]
gmr-survey = { path = ".", features = ["sqlite", "testkit", "bridge"] }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
