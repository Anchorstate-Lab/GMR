<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 1450" width="1510" height="1450" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',-apple-system,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c3a2c"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f6b52"/></marker>
</defs>
<style>
  .h    { font-size:14px;   font-weight:600; fill:#14181d }
  .hs   { font-size:11px;   fill:#5c635f }
  .st   { font-size:13.5px; font-weight:600; fill:#14181d; text-anchor:middle }
  .m    { font-size:11px;   font-weight:600; font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; fill:#3f4a58 }
  .d    { font-size:10.5px; fill:#5c635f }
  .dd   { font-size:11px;   fill:#14181d }
  .hd   { font-size:11px;   font-weight:600; fill:#3f4a58 }
  .r    { font-size:10.5px; font-weight:600; fill:#9c3a2c }
  .lbl  { font-size:10.5px; fill:#475569; font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace }
  .ty   { font-size:10px;   fill:#5b6b80; font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; text-anchor:end }
  .n    { font-size:11px;   font-weight:600; fill:#94a3b8; font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace }
</style>

<rect width="1510" height="1450" fill="#fbfcfa"/>

<text x="30" y="40" font-size="23" font-weight="600" fill="#14181d">GMR 状态机与数据链 —— 有哪些状态、谁改它、一次观测怎么走完</text>
<text x="30" y="64" font-size="13" fill="#5c635f">系统里有<tspan font-weight="600">两台</tspan>状态机，混在一起看就永远看不懂：① 是基底写死的，只有三个状态；② 是域用数据定义的，基底一个词都不认识。</text>
<text x="30" y="84" font-size="13" fill="#5c635f">③ 是事件驱动的调度圈，④ 是变化怎么交回来。模块归属见 modules.svg。</text>

<!-- ════════ ① 锚的生命周期 ════════ -->
<rect x="30" y="110" width="730" height="410" rx="4" fill="#fff" stroke="#5b6b80" stroke-width="1.5"/>
<text x="44" y="136" class="h">① 锚的生命周期 —— 基底写死的状态机，只有三个状态</text>
<text x="44" y="155" class="hs">状态<tspan font-weight="600">不存盘</tspan>。每次都是 fold(整条只增不改的日志) 当场折叠出来 —— 没有第二份真相可以漂移</text>

<rect x="58" y="182" width="140" height="44" rx="22" fill="#f1f5f9" stroke="#5b6b80" stroke-dasharray="4 3"/>
<text x="128" y="210" class="st" fill="#64748b">不存在</text>
<path d="M128 226 L128 276" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="214" y="244" class="lbl">open()</text>
<text x="214" y="261" class="d">写 Open：锚定义 + 首次观测 + 起点状态</text>

<rect x="58" y="276" width="140" height="46" rx="6" fill="#eef4ef" stroke="#3f6b52" stroke-width="2"/>
<text x="128" y="305" class="st" fill="#2f5d4e">活跃</text>

<path d="M198 288 C 244 268, 244 332, 198 312" fill="none" stroke="#3f6b52" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="262" y="286" class="hd">活跃时的四种自转移 —— 都不离开这个状态</text>
<text x="262" y="306" class="dd"><tspan class="m">observe()</tspan> 守卫命中 → 写 <tspan class="m">Transition</tspan>，state ← 新状态</text>
<text x="262" y="324" class="dd"><tspan class="m">observe()</tspan> state 与事实地址都没动 → 写 <tspan class="m">Still</tspan>，只留指针</text>
<text x="262" y="342" class="dd"><tspan class="m">observe()</tspan> 没看成 → 写 <tspan class="m">Attempt</tspan>，<tspan fill="#9c3a2c" font-weight="600">state 一动不动</tspan>，attempts+1</text>
<text x="262" y="360" class="dd"><tspan class="m">revise()</tspan> 作者改判据（四种 Change）→ 写 <tspan class="m">Revise</tspan> + 两份密封</text>

<path d="M108 322 L108 404" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M152 322 L152 404" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="214" y="382" class="dd"><tspan font-weight="600">自封</tspan>　新 status ∈ terminal —— <tspan fill="#9c3a2c">不需要任何额外条目</tspan></text>
<text x="214" y="399" class="dd"><tspan font-weight="600">显式</tspan>　close() —— 写 Close 条目，带密封理由</text>

<rect x="58" y="404" width="140" height="46" rx="6" fill="#fdf2f0" stroke="#9c3a2c" stroke-width="2"/>
<text x="128" y="433" class="st" fill="#8a3527">已终结</text>
<text x="214" y="424" class="dd">此后任何 observe() 直接返回 <tspan class="m">Observed::Closed</tspan>，一个条目都不写</text>
<text x="214" y="443" class="dd">pass() 见到它就 Retire 出队。<tspan fill="#9c3a2c" font-weight="600">基底机械兑现不可逆 —— 这是它唯一解释的语义</tspan></text>

<line x1="44" y1="470" x2="746" y2="470" stroke="#e2e6e1"/>
<text x="44" y="490" class="hd">fold 是纯函数，签名就是全部真相：</text>
<text x="44" y="508" class="lbl">&amp;[(Seq, Entry)] → AnchorState{ anchor, state, latest, closed, attempts, last_sighting, entered_at, head, revisions }</text>

<!-- ════════ ② 域的状态机 ════════ -->
<rect x="790" y="110" width="688" height="410" rx="4" fill="#fff" stroke="#5b6b80" stroke-width="1.5"/>
<text x="804" y="136" class="h">② 域的状态机 —— 状态词表由数据给，基底不认识任何一个词</text>
<text x="804" y="155" class="hs">δ(state, obs, taken_at, entered_at) → state′　　转换函数的输入只有这四样，基底不提供别的派生量</text>

<text x="804" y="182" class="hd">转换表（anchors.toml 里的 rules）—— 顺序有意义</text>
<rect x="810" y="192" width="600" height="30" rx="3" fill="#f8fbf8" stroke="#4a7a60"/>
<text x="822" y="212" class="dd"><tspan class="m" fill="#3f6b52">规则 1</tspan>　　when 守卫表达式　<tspan font-weight="600">=&gt;</tspan>　to 一个完整的新状态对象</text>
<rect x="810" y="232" width="600" height="30" rx="3" fill="#f8fbf8" stroke="#4a7a60"/>
<text x="822" y="252" class="dd"><tspan class="m" fill="#3f6b52">规则 2</tspan>　　when …　<tspan font-weight="600">=&gt;</tspan>　to …</text>
<rect x="810" y="272" width="600" height="30" rx="3" fill="#f8fbf8" stroke="#4a7a60" stroke-dasharray="4 3"/>
<text x="822" y="292" class="d">……</text>
<path d="M830 222 L830 232" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M830 262 L830 272" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M1410 207 L1450 207" fill="none" stroke="#3f6b52" stroke-width="1.4" marker-end="url(#ag)"/>
<path d="M1410 247 L1450 247" fill="none" stroke="#3f6b52" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="1418" y="285" class="d" fill="#3f6b52">命中即返回</text>
<text x="1418" y="299" class="d" fill="#3f6b52">后面不再看</text>
<text x="850" y="318" class="d">守卫为假、或算出 Absent（弃权）→ 换下一条。<tspan font-weight="600">第一条命中即生效。</tspan></text>

<text x="804" y="346" class="hd">translate 的三种结果 —— 这条线就是「世界变了」和「我们错了」的分界</text>
<text x="818" y="366" class="dd"><tspan class="m">To(新状态)</tspan>　　命中。新状态是<tspan font-weight="600">一个完整对象</tspan>，不是补丁 —— 所以表达式语言必须能构造对象</text>
<text x="818" y="384" class="dd"><tspan class="m">Unchanged</tspan>　　一条都没匹配。<tspan font-weight="600">这是正常，不是失败</tspan> —— 走 Still 还是 Transition 由 should_still 定</text>
<text x="818" y="402" class="dd"><tspan class="m" fill="#9c3a2c">Unevaluable</tspan>　守卫算出非布尔 / Fault / 新状态不是对象 —— <tspan fill="#9c3a2c">关于我们的失败</tspan>，写 Attempt</text>

<text x="804" y="434" class="hd">终结集合 terminal</text>
<text x="818" y="454" class="dd">一组 status 字符串，由 anchors.toml 声明。基底只做一件事：<tspan font-weight="600">字符串比对</tspan></text>
<text x="818" y="472" class="dd">它不知道任何一个词是什么意思 —— 英文、中文、乱码，一视同仁</text>
<text x="804" y="502" class="r">基底的状态词表是空的。这不是没做完 —— 一旦给出一套词，第二个域就只能伪装成第一个的形状。</text>

<!-- ════════ ③ 一次 observe() ════════ -->
<rect x="30" y="545" width="1448" height="515" rx="4" fill="#fff" stroke="#5b6b80" stroke-width="1.5"/>
<text x="44" y="571" class="h">③ 一次 observe(key) 的数据链 —— 左边是这一跳干什么，右边是它交出什么类型</text>
<text x="44" y="590" class="hs">这十一步全在 gmr-runtime 里，是整个系统唯一把传输 · 求值 · 存储串起来的地方</text>

<rect x="60" y="602" width="1000" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="74" y="623" class="n">1</text><text x="100" y="623" class="dd"><tspan class="m">journal.entries(key, 0)</tspan>　读这个锚的全部日志条目</text>
<text x="1048" y="623" class="ty">Vec&lt;(Seq, Entry)&gt;</text>

<rect x="60" y="642" width="1000" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="74" y="663" class="n">2</text><text x="100" y="663" class="dd"><tspan class="m">fold(entries)</tspan>　把只增不改的日志折叠成当前状态</text>
<text x="1048" y="663" class="ty">AnchorState</text>

<rect x="60" y="682" width="1000" height="32" rx="3" fill="#fdf2f0" stroke="#9c3a2c" stroke-dasharray="4 3"/>
<text x="74" y="703" class="n">3</text><text x="100" y="703" class="dd"><tspan class="m">s.closed?</tspan>　终结判定 —— <tspan fill="#9c3a2c" font-weight="600">是 → 立刻返回，一个条目都不写</tspan></text>
<text x="1048" y="703" class="ty">Observed::Closed</text>

<rect x="60" y="722" width="1000" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="74" y="743" class="n">4</text><text x="100" y="743" class="dd"><tspan class="m">s.state.position()</tspan>　从 state 里取出位置槽 —— 基底带着它，但从不读进去</text>
<text x="1048" y="743" class="ty">&amp;Value（形状是域定的）</text>

<rect x="60" y="762" width="1000" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="74" y="783" class="n">5</text><text x="100" y="783" class="dd"><tspan class="m">transports.find(kind == anchor.probe.kind)</tspan>　按 kind 选一个传输</text>
<text x="1048" y="783" class="ty">&amp;dyn Transport（找不到 = unreachable）</text>

<rect x="60" y="802" width="1000" height="32" rx="3" fill="#fffaf3" stroke="#b07f2a"/>
<text x="74" y="823" class="n">6</text><text x="100" y="823" class="dd"><tspan class="m" fill="#8a6520">Transport::invoke(&amp;declaration, position)</tspan>　<tspan fill="#8a6520">跨出基底</tspan> —— 电池 exec 探针进程</text>
<text x="1048" y="823" class="ty">Outcome | ProbeError</text>

<rect x="60" y="842" width="1000" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="74" y="863" class="n">7</text><text x="100" y="863" class="dd"><tspan class="m">observe_into</tspan>　封成观测：算事实地址、钉住两个版本号</text>
<text x="1048" y="863" class="ty">Observation{outcome, fact_address, versions}</text>

<rect x="60" y="882" width="1000" height="32" rx="3" fill="#eef4ef" stroke="#3f6b52"/>
<text x="74" y="903" class="n">8</text><text x="100" y="903" class="dd"><tspan class="m" fill="#2f5d4e">translate::transition(anchor, obs, state, taken_at, entered_at)</tspan>　跑转换表（见 ②）</text>
<text x="1048" y="903" class="ty">To | Unchanged | Unevaluable</text>

<rect x="60" y="922" width="1000" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="74" y="943" class="n">9</text><text x="100" y="943" class="dd"><tspan class="m">should_still(上次 state/地址, 这次 state/地址)</tspan>　两样都没动才算「没动」</text>
<text x="1048" y="943" class="ty">true → Still　false → Transition</text>

<rect x="60" y="962" width="1000" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="74" y="983" class="n">10</text><text x="100" y="983" class="dd"><tspan class="m">journal.append(key, &amp;entry, fence)</tspan>　唯一的写入口，带乐观并发令牌</text>
<text x="1048" y="983" class="ty">Seq</text>

<rect x="60" y="1002" width="1000" height="32" rx="3" fill="#f1f5f9" stroke="#5b6b80" stroke-width="1.5"/>
<text x="74" y="1023" class="n">11</text><text x="100" y="1023" class="dd">返回给调用方</text>
<text x="1048" y="1023" class="ty">Observed::{Transitioned{from,to} | Still | Attempt | Closed}</text>

<g fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)">
  <path d="M560 634 L560 642"/><path d="M560 674 L560 682"/><path d="M560 714 L560 722"/>
  <path d="M560 754 L560 762"/><path d="M560 794 L560 802"/><path d="M560 834 L560 842"/>
  <path d="M560 874 L560 882"/><path d="M560 914 L560 922"/><path d="M560 954 L560 962"/>
  <path d="M560 994 L560 1002"/>
</g>

<rect x="1096" y="602" width="368" height="432" rx="4" fill="#fdf2f0" stroke="#9c3a2c" stroke-dasharray="5 4"/>
<text x="1110" y="626" class="h" font-size="12.5" fill="#8a3527">关于我们的失败 —— 三条，全收敛到 Attempt</text>
<text x="1110" y="652" class="r">unreachable</text><text x="1110" y="669" class="d">探针跑不起来 / 超时　来自第 6 步</text>
<text x="1110" y="686" class="d" font-style="italic">它的沉默不是证据</text>
<text x="1110" y="712" class="r">unusable</text><text x="1110" y="729" class="d">输出形状不对 / 超上限　来自第 6 步</text>
<text x="1110" y="746" class="d" font-style="italic">拒绝而不截断 —— 截过的读数存成事实就是撒谎</text>
<text x="1110" y="772" class="r">unevaluable</text><text x="1110" y="789" class="d">守卫或新状态算不出来　来自第 8 步</text>
<text x="1110" y="806" class="d" font-style="italic">判据本身有问题，不是世界变了</text>
<line x1="1110" y1="822" x2="1450" y2="822" stroke="#e6cdc8"/>
<text x="1110" y="844" class="hd" fill="#8a3527">三条的共同处置</text>
<text x="1110" y="862" class="d">写 Entry::Attempt{reason, message}</text>
<text x="1110" y="879" class="d">state 一动不动 · entered_at 不重置 —— 我们的失败不重置世界的计时</text>
<text x="1110" y="896" class="d">attempts + 1 → 下次调度退避</text>
<text x="1110" y="920" class="r">不成条目，但一定发边沿。</text>
<text x="1110" y="937" class="d">系统里不允许存在既不成条目、也不发边沿的路径。</text>
<line x1="1110" y1="953" x2="1450" y2="953" stroke="#e6cdc8"/>
<text x="1110" y="975" class="hd">注意这一条<tspan font-weight="600">不</tspan>走上面：</text>
<text x="1110" y="993" class="d"><tspan font-family="'SF Mono',Menlo,monospace" font-weight="600">Outcome::NotFound</tspan> —— 「我看了，那儿什么都没有」</text>
<text x="1110" y="1010" class="d">这是关于<tspan font-weight="600">世界</tspan>的答案，照样成为条目、照样走转换表。</text>

<path d="M1060 818 L1096 700" fill="none" stroke="#9c3a2c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#af)"/>
<path d="M1060 898 L1096 790" fill="none" stroke="#9c3a2c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#af)"/>

<!-- ════════ ③ 调度圈 ════════ -->
<rect x="30" y="1085" width="730" height="330" rx="4" fill="#fff" stroke="#5b6b80" stroke-width="1.5"/>
<text x="44" y="1111" class="h">④ 事件驱动的那一圈 —— pass() 跑一次，这个环转一次</text>
<text x="44" y="1130" class="hs">没有配 queue 的部署就没有这一圈，只能手动 observe()。队列是 gmr-store 里唯一<tspan font-weight="600">可变</tspan>的接口</text>

<rect x="76" y="1146" width="640" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="90" y="1166" class="dd"><tspan class="m">queue.due(now, lease, batch)</tspan>　领一批到期的锚，同时上租约</text>
<rect x="76" y="1186" width="640" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="90" y="1206" class="dd"><tspan class="m">observe_with(ticket.anchor, ticket.fence)</tspan>　走完 ③ 的十一步</text>

<rect x="76" y="1226" width="640" height="96" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="90" y="1246" class="hd">按 ③ 的返回值给一个处置 Disposition：</text>
<text x="102" y="1264" class="dd"><tspan class="m">Closed</tspan>　　　　　　　　→ <tspan class="m">Retire</tspan>　退出队列，再也不排</text>
<text x="102" y="1282" class="dd"><tspan class="m" fill="#9c3a2c">Attempt</tspan>　　　　　　　→ <tspan class="m">Backoff</tspan>　base &lt;&lt; (n−1)，封顶 cap</text>
<text x="102" y="1300" class="dd"><tspan class="m">Transitioned / Still</tspan>　→ <tspan class="m">Reschedule</tspan>　anchor.cadence ?? policy.cadence</text>
<text x="102" y="1316" class="d">转换后正好进了终结集合 → 也是 Retire</text>

<rect x="76" y="1332" width="640" height="30" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="90" y="1352" class="dd"><tspan class="m">queue.settle(&amp;ticket, disposition, now)</tspan>　放租约，写下次到期</text>

<g fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)">
  <path d="M396 1176 L396 1186"/><path d="M396 1216 L396 1226"/><path d="M396 1322 L396 1332"/>
</g>
<path d="M76 1347 L56 1347 L56 1161 L76 1161" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>

<text x="44" y="1386" class="d"><tspan font-weight="600" fill="#3f4a58">租约 + fence 是唯一防重复观测的东西。</tspan>没有它，累积型的转换表（新状态里读了 state.x）会多算 —— </text>
<text x="44" y="1403" class="d">基底分辨不了「幂等地保留一个字段」和「递增一个计数」，所以 open() 在无队列部署上只发一条警告，不拒绝。</text>

<!-- ════════ ④ 边沿 ════════ -->
<rect x="790" y="1085" width="688" height="330" rx="4" fill="#fff" stroke="#5b6b80" stroke-width="1.5"/>
<text x="804" y="1111" class="h">⑤ 边沿 —— 变化怎么交回来：changed_since(cursor, status)</text>
<text x="804" y="1130" class="hs">不是推送。重放日志算出来，交回<tspan font-weight="600">边沿 + 新游标</tspan>，游标由调用方自己拿着 —— 基底不记谁读到哪</text>

<rect x="810" y="1146" width="654" height="32" rx="3" fill="#eef4ef" stroke="#3f6b52"/>
<text x="824" y="1167" class="dd"><tspan class="m" fill="#2f5d4e">Edge::Transitioned</tspan>{anchor, from, to, status, seq, at}　来源：日志里的 Transition 条目</text>
<rect x="810" y="1186" width="654" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<text x="824" y="1207" class="dd"><tspan class="m">Edge::Closed</tspan>{anchor, self_sealed}　来源：Close 条目，或 fold 判出的自封</text>
<rect x="810" y="1226" width="654" height="32" rx="3" fill="#fdf2f0" stroke="#9c3a2c"/>
<text x="824" y="1247" class="dd"><tspan class="m" fill="#9c3a2c">Edge::Stalled</tspan>{anchor, reason}　来源：连续 Attempt 超阈值，或太久没成功观测</text>
<rect x="810" y="1266" width="654" height="50" rx="3" fill="#fffaf3" stroke="#b07f2a"/>
<text x="824" y="1287" class="dd"><tspan class="m" fill="#8a6520">Edge::Rewritten</tspan>{anchor, reference, bound_version, current_version}</text>
<text x="824" y="1306" class="d" fill="#8a6520">来源：<tspan font-weight="600">不在日志里</tspan> —— 现场比对绑定时那一版与内容提供方的当前版本</text>

<text x="804" y="1344" class="d">前三条是「<tspan font-weight="600">世界</tspan>沿着我们盯的方向动了」，第四条是「<tspan font-weight="600">我们自己写的那份记录</tspan>被人改了」—— 两件事，两种处置。</text>
<text x="804" y="1366" class="d"><tspan font-weight="600" fill="#3f4a58">记忆回路：</tspan>边沿交回时，域读锚上挂着的 memories/，由电池 provider-git <tspan font-weight="600">按绑定时那一版</tspan>取回内容。</text>
<text x="804" y="1384" class="d">基底只存 Ref + bound_version + links，从不复制内容 —— 所以「内容被改了」是能被发现的，而不是被静默覆盖。</text>
<text x="804" y="1406" class="r">边沿只是交出来。改代码还是改判据，是 owner 的判断，工具不替他做。</text>
</svg>
