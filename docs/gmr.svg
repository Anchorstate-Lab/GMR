<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="title desc">
  <title id="title">GMR 总览</title>
  <desc id="desc">GMR 把主观记录挂到可观测的锚上，运行时观察外部世界、执行规则、追加日志，并由 fold 折叠出当前状态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <marker id="soft-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102027" flood-opacity="0.11"/>
    </filter>
    <style>
      .bg { fill:#f7f5ef; }
      .title { font: 700 34px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#172126; }
      .sub { font: 500 15px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#56666c; }
      .box-title { font: 700 19px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#172126; }
      .body { font: 500 14px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#34444a; }
      .small { font: 500 12px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#607078; }
      .mono { font: 700 13px "SF Mono","JetBrains Mono",Menlo,monospace; fill:#263238; }
      .tag { font: 700 12px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#ffffff; }
      .line { fill:none; stroke:#263238; stroke-width:2.2; marker-end:url(#arrow); }
      .soft-line { fill:none; stroke:#607d8b; stroke-width:1.8; marker-end:url(#soft-arrow); }
      .dash { stroke-dasharray:8 7; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="780"/>
  <text x="64" y="66" class="title">GMR 一眼看懂</text>
  <text x="64" y="96" class="sub">把一条主观记录，挂到一个可观测的锚上；世界沿作者声明的方向变化时，把这条记录重新交出来。</text>

  <rect x="64" y="128" width="1152" height="92" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="94" y="162" class="box-title">一句话</text>
  <text x="196" y="163" class="body">记忆不是直接“保真”；GMR 只保证：作者声明过的那几条变化方向，不会静悄悄错过。</text>
  <text x="196" y="191" class="small">没有声明的方向，系统不会假装知道。这是设计边界，不是 bug。</text>

  <!-- main columns -->
  <rect x="64" y="272" width="260" height="244" rx="10" fill="#fffdf8" stroke="#d7c091" filter="url(#shadow)"/>
  <rect x="92" y="250" width="132" height="34" rx="17" fill="#8a6426"/>
  <text x="158" y="272" class="tag" text-anchor="middle">用户世界</text>
  <text x="94" y="314" class="box-title">记录与事实</text>
  <text x="94" y="348" class="body">memories/</text>
  <text x="94" y="372" class="small">主观记录，内容在外部。</text>
  <text x="94" y="408" class="body">anchors.toml</text>
  <text x="94" y="432" class="small">声明锚、规则、终结态。</text>
  <text x="94" y="468" class="body">外部世界</text>
  <text x="94" y="492" class="small">代码、文件、接口、指标等。</text>

  <rect x="392" y="248" width="496" height="300" rx="12" fill="#ffffff" stroke="#9bb5bb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="560" y="226" width="160" height="38" rx="19" fill="#2f6f7e"/>
  <text x="640" y="250" class="tag" text-anchor="middle">GMR 运行核心</text>

  <rect x="432" y="300" width="176" height="76" rx="8" fill="#edf6f8" stroke="#6f9ba5"/>
  <text x="520" y="326" class="box-title" text-anchor="middle">Anchor 锚</text>
  <text x="520" y="350" class="small" text-anchor="middle">state + rules + terminal</text>
  <text x="520" y="368" class="small" text-anchor="middle">“我关心什么”</text>

  <rect x="672" y="300" width="176" height="76" rx="8" fill="#f0f5ee" stroke="#82a66a"/>
  <text x="760" y="326" class="box-title" text-anchor="middle">Runtime</text>
  <text x="760" y="350" class="small" text-anchor="middle">open / observe / read</text>
  <text x="760" y="368" class="small" text-anchor="middle">“把流程跑起来”</text>

  <rect x="432" y="424" width="176" height="78" rx="8" fill="#f8f4ea" stroke="#b89b5e"/>
  <text x="520" y="450" class="box-title" text-anchor="middle">Probe</text>
  <text x="520" y="474" class="small" text-anchor="middle">拿 position 去看世界</text>
  <text x="520" y="492" class="small" text-anchor="middle">返回 obs / not found</text>

  <rect x="672" y="424" width="176" height="78" rx="8" fill="#f4eff7" stroke="#a888b8"/>
  <text x="760" y="450" class="box-title" text-anchor="middle">Expr</text>
  <text x="760" y="474" class="small" text-anchor="middle">用 obs + state 跑规则</text>
  <text x="760" y="492" class="small" text-anchor="middle">得到新 state</text>

  <path d="M608 338 H672" class="soft-line"/>
  <path d="M760 376 V424" class="soft-line"/>
  <path d="M672 462 H608" class="soft-line"/>
  <path d="M520 424 V376" class="soft-line"/>
  <text x="640" y="407" class="mono" text-anchor="middle">observe loop</text>

  <rect x="956" y="272" width="260" height="244" rx="10" fill="#fffdfd" stroke="#d49a9a" filter="url(#shadow)"/>
  <rect x="984" y="250" width="132" height="34" rx="17" fill="#9b3f3f"/>
  <text x="1050" y="272" class="tag" text-anchor="middle">只增日志</text>
  <text x="986" y="314" class="box-title">Store</text>
  <text x="986" y="348" class="body">Entry[]</text>
  <text x="986" y="372" class="small">Open / Transition / Still</text>
  <text x="986" y="392" class="small">Attempt / Revise / Close</text>
  <text x="986" y="432" class="body">Core::fold</text>
  <text x="986" y="456" class="small">日志不是缓存。</text>
  <text x="986" y="480" class="small">当前状态每次折叠出来。</text>

  <path d="M324 394 H392" class="line"/>
  <text x="358" y="378" class="small" text-anchor="middle">声明 / 绑定</text>

  <path d="M888 394 H956" class="line"/>
  <text x="922" y="378" class="small" text-anchor="middle">追加 Entry</text>

  <path d="M956 512 C 820 644, 450 644, 320 516" class="soft-line dash"/>
  <text x="640" y="654" class="small" text-anchor="middle">read / edges：把 AnchorState 和变化交回给使用者</text>

  <rect x="126" y="600" width="1028" height="86" rx="10" fill="#172126"/>
  <text x="160" y="634" class="tag">核心不变量</text>
  <text x="160" y="664" font-family="Avenir Next, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" font-weight="500" fill="#e9eee9">事实是否变化，由探针观察；状态是否变化，由规则判断；历史是否可信，由只增日志保证；当前状态由 fold 重算。</text>
</svg>
