<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" width="1500" height="1050" role="img" aria-labelledby="title desc">
  <title id="title">一次 observe(key) 的时序图</title>
  <desc id="desc">时序图展示调用方、Runtime、Journal、Core fold、Transport Probe、Expr 之间如何完成一次 observe，并展示 Closed、Attempt、Still、Transition 四类归宿。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="fail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b3f3f"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#102027" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font:700 34px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#172126; }
      .sub { font:500 15px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#56666c; }
      .actor { font:800 15px "SF Mono","JetBrains Mono",Menlo,monospace; fill:#172126; }
      .actor-sub { font:600 11px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#617178; }
      .msg { font:700 12px "SF Mono","JetBrains Mono",Menlo,monospace; fill:#263238; }
      .msg-cn { font:600 12px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#405157; }
      .ret { font:700 11px "SF Mono","JetBrains Mono",Menlo,monospace; fill:#607d8b; }
      .branch-title { font:800 12px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#ffffff; }
      .branch-text { font:600 12px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#5a3131; }
      .note-head { font:800 14px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#172126; }
      .note { font:500 12.5px "Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; fill:#53636a; }
      .line { stroke:#263238; stroke-width:2; marker-end:url(#arrow); }
      .return { stroke:#607d8b; stroke-width:1.8; stroke-dasharray:7 6; marker-end:url(#return-arrow); }
      .fail { stroke:#9b3f3f; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#fail-arrow); }
      .life { stroke:#aeb8bc; stroke-width:1.5; stroke-dasharray:5 7; }
      .activation { fill:#ffffff; stroke:#607d8b; stroke-width:1.4; }
    </style>
  </defs>

  <rect width="1500" height="1050" fill="#f7f5ef"/>
  <text x="64" y="66" class="title">一次 observe(key) 的时序图</text>
  <text x="64" y="96" class="sub">时间从上往下。正常路径写 Still 或 Transition；所有“我们的失败”都收敛成 Attempt；已终结直接返回 Closed。</text>

  <!-- participants -->
  <g id="participants">
    <rect x="54" y="138" width="150" height="58" rx="8" fill="#ffffff" stroke="#9aa7ad" filter="url(#shadow)"/>
    <text x="129" y="163" class="actor" text-anchor="middle">Caller</text>
    <text x="129" y="181" class="actor-sub" text-anchor="middle">CLI / pass</text>

    <rect x="272" y="138" width="170" height="58" rx="8" fill="#edf6f8" stroke="#2f6f7e" filter="url(#shadow)"/>
    <text x="357" y="163" class="actor" text-anchor="middle">Runtime</text>
    <text x="357" y="181" class="actor-sub" text-anchor="middle">observe_with</text>

    <rect x="510" y="138" width="170" height="58" rx="8" fill="#fff2f2" stroke="#a85b5b" filter="url(#shadow)"/>
    <text x="595" y="163" class="actor" text-anchor="middle">Journal</text>
    <text x="595" y="181" class="actor-sub" text-anchor="middle">gmr-store</text>

    <rect x="748" y="138" width="170" height="58" rx="8" fill="#ffffff" stroke="#263238" filter="url(#shadow)"/>
    <text x="833" y="163" class="actor" text-anchor="middle">Core</text>
    <text x="833" y="181" class="actor-sub" text-anchor="middle">fold / state</text>

    <rect x="986" y="138" width="170" height="58" rx="8" fill="#fffaf0" stroke="#a9823a" filter="url(#shadow)"/>
    <text x="1071" y="163" class="actor" text-anchor="middle">Transport</text>
    <text x="1071" y="181" class="actor-sub" text-anchor="middle">Probe adapter</text>

    <rect x="1224" y="138" width="170" height="58" rx="8" fill="#f4eff7" stroke="#8e6aa2" filter="url(#shadow)"/>
    <text x="1309" y="163" class="actor" text-anchor="middle">Expr</text>
    <text x="1309" y="181" class="actor-sub" text-anchor="middle">transition rules</text>
  </g>

  <!-- lifelines -->
  <g id="lifelines">
    <line x1="129" y1="196" x2="129" y2="940" class="life"/>
    <line x1="357" y1="196" x2="357" y2="940" class="life"/>
    <line x1="595" y1="196" x2="595" y2="940" class="life"/>
    <line x1="833" y1="196" x2="833" y2="940" class="life"/>
    <line x1="1071" y1="196" x2="1071" y2="940" class="life"/>
    <line x1="1309" y1="196" x2="1309" y2="940" class="life"/>
  </g>

  <!-- activation bars -->
  <rect x="348" y="230" width="18" height="635" class="activation"/>
  <rect x="586" y="274" width="18" height="42" class="activation"/>
  <rect x="824" y="340" width="18" height="42" class="activation"/>
  <rect x="1062" y="520" width="18" height="54" class="activation"/>
  <rect x="1300" y="656" width="18" height="54" class="activation"/>
  <rect x="586" y="802" width="18" height="42" class="activation"/>

  <!-- messages -->
  <line x1="129" y1="246" x2="348" y2="246" class="line"/>
  <text x="148" y="236" class="msg">observe(key)</text>

  <line x1="366" y1="290" x2="586" y2="290" class="line"/>
  <text x="386" y="280" class="msg">entries(key, 0)</text>
  <line x1="586" y1="316" x2="366" y2="316" class="return"/>
  <text x="430" y="308" class="ret">Entry[]</text>

  <line x1="366" y1="356" x2="824" y2="356" class="line"/>
  <text x="386" y="346" class="msg">fold(entries)</text>
  <line x1="824" y1="382" x2="366" y2="382" class="return"/>
  <text x="612" y="374" class="ret">AnchorState { anchor, state, closed, entered_at, ... }</text>

  <!-- closed branch -->
  <rect x="266" y="412" width="400" height="72" rx="8" fill="#fff4f4" stroke="#b76d6d"/>
  <rect x="266" y="412" width="86" height="24" rx="8" fill="#9b3f3f"/>
  <text x="309" y="429" class="branch-title" text-anchor="middle">alt</text>
  <text x="372" y="430" class="branch-text">s.closed == true</text>
  <line x1="348" y1="462" x2="129" y2="462" class="fail"/>
  <text x="166" y="452" class="ret">Observed::Closed</text>

  <!-- normal after closed -->
  <line x1="366" y1="520" x2="1062" y2="520" class="line"/>
  <text x="386" y="510" class="msg">invoke(anchor.probe.declaration, state.position())</text>
  <line x1="1062" y1="574" x2="366" y2="574" class="return"/>
  <text x="744" y="566" class="ret">Outcome::Found{facts} 或 Outcome::NotFound</text>

  <!-- probe error branch -->
  <rect x="732" y="588" width="444" height="48" rx="8" fill="#fff4f4" stroke="#b76d6d"/>
  <rect x="732" y="588" width="86" height="24" rx="8" fill="#9b3f3f"/>
  <text x="775" y="605" class="branch-title" text-anchor="middle">alt</text>
  <text x="838" y="606" class="branch-text">Transport 返回 ProbeError：unreachable / unusable</text>
  <line x1="366" y1="624" x2="586" y2="624" class="fail"/>
  <text x="386" y="614" class="msg-cn">append Entry::Attempt</text>

  <line x1="366" y1="656" x2="1300" y2="656" class="line"/>
  <text x="386" y="646" class="msg">transition(anchor, observation, state, taken_at, entered_at)</text>
  <line x1="1300" y1="710" x2="366" y2="710" class="return"/>
  <text x="760" y="702" class="ret">To(State) / Unchanged / Unevaluable</text>

  <!-- expr failure branch -->
  <rect x="760" y="724" width="420" height="48" rx="8" fill="#fff4f4" stroke="#b76d6d"/>
  <rect x="760" y="724" width="86" height="24" rx="8" fill="#9b3f3f"/>
  <text x="803" y="741" class="branch-title" text-anchor="middle">alt</text>
  <text x="866" y="742" class="branch-text">Unevaluable：规则本身算不出来</text>
  <line x1="366" y1="760" x2="586" y2="760" class="fail"/>
  <text x="386" y="750" class="msg-cn">append Entry::Attempt</text>

  <!-- normal write -->
  <path d="M366 802 H586" class="line"/>
  <text x="386" y="792" class="msg">append Entry::Still</text>
  <text x="386" y="824" class="msg">或 Entry::Transition</text>
  <line x1="586" y1="844" x2="366" y2="844" class="return"/>
  <text x="454" y="836" class="ret">Seq</text>

  <line x1="348" y1="865" x2="129" y2="865" class="line"/>
  <text x="156" y="855" class="msg-cn">Observed::Still / Transitioned / Attempt</text>

  <!-- right side explanation -->
  <rect x="1020" y="804" width="380" height="136" rx="10" fill="#172126"/>
  <text x="1050" y="836" font-family="Avenir Next, PingFang SC, sans-serif" font-size="15" font-weight="800" fill="#ffffff">图的关键</text>
  <text x="1050" y="866" font-family="Avenir Next, PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#dfe9e9">NotFound 不是失败：它是“我看了，那里没有”。</text>
  <text x="1050" y="890" font-family="Avenir Next, PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#dfe9e9">ProbeError 和 Unevaluable 是我们的失败，统一写 Attempt。</text>
  <text x="1050" y="914" font-family="Avenir Next, PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#dfe9e9">真正的状态只来自日志折叠；没有第二份真相。</text>

  <!-- footer legend -->
  <rect x="64" y="970" width="1372" height="42" rx="21" fill="#ffffff" stroke="#d0d7da"/>
  <line x1="92" y1="991" x2="148" y2="991" class="line"/>
  <text x="164" y="996" class="note">调用</text>
  <line x1="240" y1="991" x2="296" y2="991" class="return"/>
  <text x="312" y="996" class="note">返回值</text>
  <line x1="418" y1="991" x2="474" y2="991" class="fail"/>
  <text x="490" y="996" class="note">失败分支，写 Attempt 或直接 Closed</text>
  <text x="760" y="996" class="note">时间从上往下；竖虚线是参与者生命线；窄白条表示该参与者正在处理。</text>
</svg>
